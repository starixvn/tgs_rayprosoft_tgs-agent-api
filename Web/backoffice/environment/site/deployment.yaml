apiVersion: apps/v1
kind: Deployment
metadata:
  name: backoffice-site
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: backoffice-site
  template:
    metadata:
      labels:
        app: backoffice-site
    spec:
      containers:
        - name: backoffice-site
          image: registry.gitlab.com/rayprosoft/turnkey-gaming-system/backoffice-site:0.0.1-5315ce0
          ports:
            - containerPort: 80
          volumeMounts:
            - name: site-data
              mountPath: /data
      volumes:
        - name: site-data
          emptyDir: {}
