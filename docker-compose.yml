version: "3.8"

services:
  traefik:
    image: traefik:v2.2
    container_name: traefik
    command:
      - --api.dashboard=true
      - --api.insecure=true # Debug router
      - --providers.docker=true
      # - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      # Log
      - --log.level=INFO
      # Monitoring
      - --metrics=true
      - --metrics.prometheus=true
      - --metrics.prometheus.addEntryPointsLabels=true
      - --metrics.prometheus.addServicesLabels=true
      # Tracing
      - --tracing.jaeger=true
      - --tracing.serviceName=traefik
      - --tracing.jaeger.samplingServerURL=http://jaeger:5778/sampling
      - --tracing.jaeger.localAgentHostPort=jaeger:6831
      - --tracing.jaeger.gen128Bit
      - --tracing.jaeger.traceContextHeaderName=traefik-trace-id
      # - --tracing.jaeger.collector.endpoint=http://jaeger:14268/api/traces?format=jaeger.thrift
    ports:
      # The Web UI (enabled by --api.insecure=true) -> http://localhost:9000/dashboard#/
      - 9000:8080
      - 80:80
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      tgs:
    depends_on:
      - backoffice-site
      - mocksite

  # Monitoring
  prometheus:
    image: prom/prometheus:v2.20.1
    container_name: prometheus
    labels:
      traefik.enable: true
      traefik.http.routers.prometheus.rule: "Host(`prometheus.localhost`)"
      traefik.http.routers.prometheus.entrypoints: "web"
      traefik.http.routers.prometheus.service: "prometheus"
      traefik.http.services.prometheus.loadbalancer.server.port: 9090
    ports:
      - 9090:9090
    networks:
      tgs:

  # Tracing
  jaeger:
    image: jaegertracing/all-in-one:1.19.2
    container_name: jaeger
    environment:
      COLLECTOR_ZIPKIN_HTTP_PORT: 9411
    ports:
      - "5775:5775/udp"
      - "6831:6831/udp"
      - "6832:6832/udp"
      - "5778:5778"
      - "16686:16686" # Web UI
      - "14268:14268"
      - "14250:14250"
      - "9411:9411"
    labels:
      traefik.enable: true
      traefik.http.routers.jaeger.rule: "Host(`jaeger.localhost`)"
      traefik.http.routers.jaeger.entrypoints: "web"
      traefik.http.routers.jaeger.service: "jaeger"
      traefik.http.services.jaeger.loadbalancer.server.port: 16686
    networks:
      tgs:

  mocksite:
    build:
      context: .
      dockerfile: ./Web/mocksite/Dockerfile
    image: mocksite
    container_name: mocksite
    labels:
      - traefik.enable=true
      - traefik.http.routers.mocksite.rule=Host(`mocksite.localhost`)
      - traefik.http.routers.mocksite.entrypoints=web
    networks:
      tgs:
    depends_on:
      - operator-api
      - global-api

  backoffice-site:
    build:
      context: .
      dockerfile: ./Web/backoffice/Dockerfile
    image: backoffice-site
    container_name: backoffice-site
    labels:
      - traefik.enable=true
      - traefik.http.routers.backoffice-site.rule=Host(`backoffice.localhost`)
      - traefik.http.routers.backoffice-site.entrypoints=web
    networks:
      tgs:
    depends_on:
      - backoffice-api
      - fileservice

  backoffice-api:
    build:
      context: .
      dockerfile: Apis/BackendOffice/Dockerfile
    image: backoffice-api
    container_name: backoffice-api
    labels:
      - traefik.enable=true
      - traefik.http.routers.backoffice-api.rule=Host(`backoffice.localhost`) && (PathPrefix(`/api`))
      - traefik.http.routers.backoffice-api.entrypoints=web
    environment:
      ASPNETCORE_ENVIRONMENT: "Docker"
    # For crash debug
    # entrypoint: ["sh", "-c", "sleep infinity"]
    ports:
      - 32667:80
    networks:
      tgs:
        aliases:
          - backoffice.api
    depends_on:
      - postgres
      - log-api
      - game-sbo
      - redis

  fileservice:
    build:
      context: .
      dockerfile: Apis/FileService/Dockerfile
    image: fileservice
    container_name: fileservice
    labels:
      - traefik.enable=true
      - traefik.http.routers.fileservice.rule=Host(`backoffice.localhost`) && PathPrefix(`/fs`)
      - traefik.http.routers.fileservice.entrypoints=web
    environment:
      ASPNETCORE_ENVIRONMENT: "Docker"
    ports:
      - 32671:80
    networks:
      tgs:
    depends_on:
      - mongodb

  mongodb:
    image: mongo:4.2.0
    container_name: mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: "root"
      MONGO_INITDB_ROOT_PASSWORD: "1qaz2wsx!@"
    volumes:
      - ./.docker/mongodb/db:/data/db
      - ./.docker/mongodb/config:/etc/mongod.conf
      - ./.docker/mongodb/log:/var/log/mongodb/
    networks:
      tgs:
    ports:
      - 27017:27017
    restart: unless-stopped

  operator-api:
    build:
      context: .
      dockerfile: Apis/OperatorApi/Dockerfile
    image: operator-api
    container_name: operator-api
    labels:
      - traefik.enable=true
      - traefik.http.routers.operator-api.rule=Host(`mocksite.localhost`) && PathPrefix(`/api`)
      - traefik.http.routers.operator-api.entrypoints=web
    environment:
      ASPNETCORE_ENVIRONMENT: "Docker"
    # For crash debug
    # entrypoint: ["sh", "-c", "sleep infinity"]
    ports:
      - 32670:80
    networks:
      tgs:
    depends_on:
      - postgres
      - game-sbo

  game-sbo:
    build:
      context: .
      dockerfile: Apis/TgsApi/Dockerfile
    image: tgs-api
    container_name: game-sbo
    environment:
      ASPNETCORE_ENVIRONMENT: "Docker"
      GameProviderCode: "SBO"
    # For crash debug
    # entrypoint: ["sh", "-c", "sleep infinity"]
    ports:
      - 32669:80
    networks:
      tgs:
    depends_on:
      - postgres
      - nats
      - redis
      - log-api

  log-api:
    build:
      context: .
      dockerfile: Apis/LogApi/Dockerfile
    image: log-api
    container_name: log-api
    environment:
      ASPNETCORE_ENVIRONMENT: "Docker"
    # For crash debug
    # entrypoint: ["sh", "-c", "sleep infinity"]
    ports:
      - 32668:80
    networks:
      tgs:
        aliases:
          - log.api
    depends_on:
      - postgres
      - nats
      - redis

  global-api:
    build:
      context: .
      dockerfile: Apis/GlobalApi/Dockerfile
    image: global-api
    container_name: global-api
    labels:
      - traefik.enable=true
      - traefik.http.routers.global-api.rule=Host(`mocksite.localhost`) && PathPrefix(`/global-api`)
      - traefik.http.routers.global-api.entrypoints=web
    environment:
      ASPNETCORE_ENVIRONMENT: "Docker"
    # For crash debug
    # entrypoint: ["sh", "-c", "sleep infinity"]
    ports:
      - 32666:80
    networks:
      tgs:
        aliases:
          - global.api
    depends_on:
      - postgres
      - operator-api

  nats:
    image: nats
    container_name: nats
    environment:
      ASPNETCORE_ENVIRONMENT: "Docker"
    expose:
      - "4222"
    ports:
      - "8222:8222"
      - 4222:4222
    networks:
      tgs:
    restart: unless-stopped

  redis:
    image: "redis:alpine"
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      tgs:
    restart: unless-stopped

  localstack:
    container_name: localstack
    image: localstack/localstack-full
    networks:
      tgs:
    ports:
      - "4566:4566"
      - "4571:4571"
      - "8080:8080"
    environment:
      - SERVICES=s3
      - DEBUG=1
      - DATA_DIR=/tmp/localstack/data
    volumes:
      - ./.docker/localstack/data:/tmp/localstack
      - "/var/run/docker.sock:/var/run/docker.sock"
      - ./localstack/bin:/docker-entrypoint-initaws.d

  postgres:
    image: postgres:12
    container_name: postgres
    environment:
      POSTGRES_USER: "tgs"
      POSTGRES_PASSWORD: "1qaz2wsx!@"
      PGDATA: /data/postgres
    volumes:
      - ./.docker/postgres:/data/postgres
    ports:
      - "5432:5432"
    networks:
      - tgs
    restart: unless-stopped

  pgadmin:
    container_name: pgadmin4
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: "tgs.dev@tgsdev.com"
      PGADMIN_DEFAULT_PASSWORD: "1qaz2wsx!@"
    volumes:
      - ./.docker/pgadmin/data:/root/.pgadmin
    ports:
      - "5050:80"
    networks:
      - tgs
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: Workers/Schedulers/Dockerfile
    image: scheduler
    container_name: scheduler
    environment:
      ASPNETCORE_ENVIRONMENT: "Docker"
    ports:
       - 32340:80
    networks:
      tgs:
        aliases:
          - scheduler
    depends_on: 
      - nats
      - postgres
      - mongodb
      - redis
      - game-sbo
networks:
  tgs:
    driver: bridge
