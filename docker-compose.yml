version: "3.8"

services:
  traefik:
    image: traefik:v2.2
    command:
      - --api.dashboard=true
      - --api.insecure=true # Debug router
      - --providers.docker=true
      # - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      # Log
      - --log.level=INFO
      # Monitoring
      - --metrics=true
      - --metrics.prometheus=true
      - --metrics.prometheus.addEntryPointsLabels=true
      - --metrics.prometheus.addServicesLabels=true
      # Tracing
      - --tracing.jaeger=true
      - --tracing.serviceName=traefik
      - --tracing.jaeger.samplingServerURL=http://jaeger:5778/sampling
      - --tracing.jaeger.localAgentHostPort=jaeger:6831
      - --tracing.jaeger.gen128Bit
      - --tracing.jaeger.traceContextHeaderName=traefik-trace-id
      # - --tracing.jaeger.collector.endpoint=http://jaeger:14268/api/traces?format=jaeger.thrift
    ports:
      # The Web UI (enabled by --api.insecure=true) -> http://localhost:9000/dashboard#/
      - 9000:8080
      - 80:80
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      tgs:
    depends_on:
      - backoffice-api
      - backoffice-site

  # Monitoring
  prometheus:
    image: prom/prometheus:v2.20.1
    labels:
      traefik.enable: true
      traefik.http.routers.prometheus.rule: "Host(`prometheus.localhost`)"
      traefik.http.routers.prometheus.entrypoints: "web"
      traefik.http.routers.prometheus.service: "prometheus"
      traefik.http.services.prometheus.loadbalancer.server.port: 9090
    ports:
      - 9090:9090
    networks:
      tgs:

  # Tracing
  jaeger:
    image: jaegertracing/all-in-one:1.19.2
    environment:
      COLLECTOR_ZIPKIN_HTTP_PORT: 9411
    ports:
      - "5775:5775/udp"
      - "6831:6831/udp"
      - "6832:6832/udp"
      - "5778:5778"
      - "16686:16686" # Web UI
      - "14268:14268"
      - "14250:14250"
      - "9411:9411"
    labels:
      traefik.enable: true
      traefik.http.routers.jaeger.rule: "Host(`jaeger.localhost`)"
      traefik.http.routers.jaeger.entrypoints: "web"
      traefik.http.routers.jaeger.service: "jaeger"
      traefik.http.services.jaeger.loadbalancer.server.port: 16686
    networks:
      tgs:

  backoffice-site:
    build:
      context: ./Web/backoffice
      dockerfile: Dockerfile
    image: backoffice-site
    container_name: backoffice-site
    labels:
      - traefik.enable=true
      - traefik.http.routers.backoffice-site.rule=Host(`backoffice.localhost`)
      - traefik.http.routers.backoffice-site.entrypoints=web
    # ports:
    #   - 8080:80
    networks:
      tgs:
    depends_on:
      - backoffice-api
      - fileservice

  backoffice-api:
    build:
      context: .
      dockerfile: Apis/BackendOffice/Dockerfile
    image: backoffice-api
    labels:
      - traefik.enable=true
      - traefik.http.routers.backoffice-api.rule=Host(`backoffice.localhost`) && PathPrefix(`/api`)
      - traefik.http.routers.backoffice-api.entrypoints=web
    environment:
      ASPNETCORE_ENVIRONMENT: "Docker"
    # For crash debug
    # entrypoint: ["sh", "-c", "sleep infinity"]
    ports:
      - 32667:80
    networks:
      tgs:
        aliases:
          - backoffice.api
    depends_on:
      - sqlserver
      - log-api
      - tgs-api

  fileservice:
    build:
      context: .
      dockerfile: Apis/FileService/Dockerfile
    image: fileservice
    container_name: fileservice
    environment:
      ASPNETCORE_ENVIRONMENT: "Docker"
    ports:
      - 32671:80
    networks:
      tgs:
    depends_on:
      - mongodb

  mongodb:
    image: mongo:4.2.0
    container_name: mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: "root"
      MONGO_INITDB_ROOT_PASSWORD: "1qaz2wsx!@"
    volumes:
      - ./.docker/mongodb/db:/data/db
      - ./.docker/mongodb/config:/etc/mongod.conf
      - ./.docker/mongodb/log:/var/log/mongodb/
    networks:
      tgs:
    ports:
      - 27017:27017
  operator-api:
    build:
      context: .
      dockerfile: Apis/OperatorApi/Dockerfile
    image: operator-api
    environment:
      ASPNETCORE_ENVIRONMENT: "Docker"
    # For crash debug
    # entrypoint: ["sh", "-c", "sleep infinity"]
    ports:
      - 32670:80
    networks:
      tgs:
        aliases:
          - operator.api
    depends_on:
      - tgs-api

  tgs-api:
    build:
      context: .
      dockerfile: Apis/TgsApi/Dockerfile
    image: tgs-api
    environment:
      ASPNETCORE_ENVIRONMENT: "Docker"
      GameProviderCode: "RT"
      GameProviderName: "RedTiger"
    # For crash debug
    # entrypoint: ["sh", "-c", "sleep infinity"]
    ports:
      - 32669:80
    networks:
      tgs:
        aliases:
          - tgs.api
    depends_on:
      - nats
      - redis
      - log-api

  log-api:
    build:
      context: .
      dockerfile: Apis/LogApi/Dockerfile
    image: log-api
    environment:
      ASPNETCORE_ENVIRONMENT: "Docker"
    # For crash debug
    # entrypoint: ["sh", "-c", "sleep infinity"]
    ports:
      - 32668:80
    networks:
      tgs:
        aliases:
          - log.api
    depends_on:
      - nats
      - redis

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2019-CU5-ubuntu-18.04
    container_name: sqlserver
    environment:
      SA_PASSWORD: "1qaz2wsx!@"
      ACCEPT_EULA: "Y"
    ports:
      - 1433:1433
    networks:
      tgs:

  nats:
    image: nats
    container_name: nats
    environment:
      ASPNETCORE_ENVIRONMENT: "Docker"
    expose:
      - "4222"
    ports:
      - "8222:8222"
      - 4222:4222
    networks:
      tgs:

  redis:
    image: "redis:alpine"
    ports:
      - "6379:6379"
    networks:
      tgs:

  localstack:
    container_name: localstack
    image: localstack/localstack-full
    networks:
      tgs:
    ports:
      - "4566:4566"
      - "4571:4571"
      - "8080:8080"
    environment:
      - SERVICES=s3
      - DEBUG=1
      - DATA_DIR=/tmp/localstack/data
    volumes:
      - ./.docker/localstack/data:/tmp/localstack
      - "/var/run/docker.sock:/var/run/docker.sock"
      - ./localstack/bin:/docker-entrypoint-initaws.d
networks:
  tgs:
    driver: bridge
