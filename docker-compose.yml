version: "3.8"

services:
  backoffice-api:
    build:
      context: .
      dockerfile: Dockerfile.BackofficeApi
    image: backoffice-api
    ports:
      - 32667:80
    networks:
      tgs:
    depends_on:
      - sqlserver

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2019-CU5-ubuntu-18.04
    container_name: sqlserver
    environment:
      SA_PASSWORD: "1qaz2wsx!@"
      ACCEPT_EULA: "Y"
    ports:
      - 1433:1433
    networks:
      tgs:

networks:
  tgs:
    driver: bridge
