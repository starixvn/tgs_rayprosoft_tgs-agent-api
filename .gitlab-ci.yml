image: mcr.microsoft.com/dotnet/core/sdk:3.1

stages:
  - build
  - test
variables:
  solution: "rpt.sln"
  
before_script:
  - "dotnet restore $solution"

build:
  stage: build
  variables:
  script:
    - "dotnet build $solution"

unit test:
  stage: test
  script:
    - "dotnet test $solution"  
