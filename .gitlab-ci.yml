image: mcr.microsoft.com/dotnet/sdk:5.0.100-rc.2-buster-slim-amd64

stages:
  - build
  - test
variables:
  solution: "tgs.sln"

services:
  - redis:latest

#connect:
#  image: redis
#  script:
#  - redis-cli -h redis PING

before_script:
  - "dotnet restore $solution"

build:
  stage: build
  script:
    - "dotnet build $solution"

tests:
  stage: test
  script:
    - 'dotnet test $solution --filter Unit /p:CollectCoverage=true' 
  artifacts:
    when: always