image: mcr.microsoft.com/dotnet/sdk:5.0

stages:
  - build
  - test
variables:
  solution: "tgs.sln"
  
before_script:
  - "docker run --name redis-tgs -p 6379:6379 -d redis --restart unless-stopped"
  - "dotnet restore $solution"

build:
  stage: build
  variables:
  script:
    - "dotnet build $solution"

unit test:
  stage: test
  script:
    - "dotnet test $solution"  
