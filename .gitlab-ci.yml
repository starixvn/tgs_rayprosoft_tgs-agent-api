image: mcr.microsoft.com/dotnet/sdk:5.0

stages:
  - build
  - test
variables:
  solution: "tgs.sln"

services:
  - redis:latest

#connect:
#  image: redis
#  script:
#  - redis-cli -h redis PING

before_script:
  - "dotnet restore $solution"

build:
  stage: build
  variables:
  script:
    - "dotnet build $solution"

tests:
  stage: test
  script:
    - 'dotnet test $solution --filter Unit --test-adapter-path:. --logger:"junit;LogFilePath=..\artifacts\{assembly}-test-result.xml;MethodFormat=Class;FailureBodyFormat=Verbose"'
  artifacts:
    when: always
    paths:
        - ./**/*test-result.xml
    reports:
      junit:
        - ./**/*test-result.xml