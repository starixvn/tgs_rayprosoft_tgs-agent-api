stages:
  - build
  - test

build-code:
  stage: build
  script:
    - dotnet build -c $BuildConfiguration
  only:
    - merge_requests
  # artifacts:
  #   untracked: true
  #   expire_in: "1 days"

unit-test:
  stage: test
  script:
    - dotnet test -c $BuildConfiguration -l:"junit;LogFilePath=../TestReports/{assembly}-TestReport.xml"
    - echo $?
  needs:
    - job: build-code
      artifacts: false
  only:
    - merge_requests
  artifacts:
    when: always
    reports:
      junit: ./src/Tests/TestReports/*-TestReport.xml
