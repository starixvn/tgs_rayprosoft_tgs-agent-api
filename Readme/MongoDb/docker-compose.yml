version: '3.7'
services:
  mongo:
    image: mongo:${MONGO_VERSION}
    container_name: "${CONTAINER_NAME}-mongo"
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_ROOT_USER}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_ROOT_PASS}"
    volumes:
    - mongo-db:/data/db
    - mongo-config:/etc/mongod.conf
    - mongo-log:/var/log/mongodb/
    ports:
    - "${MONGO_PORT}:27017"
    networks:
    - net-tgs
  mongo-express:
    image: mongo-express
    container_name: "${CONTAINER_NAME}-mongo-express"
    restart: always
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: "${MONGO_ROOT_USER}"
      ME_CONFIG_MONGODB_ADMINPASSWORD: "${MONGO_ROOT_PASS}"
      ME_CONFIG_BASICAUTH_USERNAME: "${MONGO_EXPRESS_USER}"
      ME_CONFIG_BASICAUTH_PASSWORD: "${MONGO_EXPRESS_PASS}"
    ports:
    - "${MONGO_EXPRESS_PORT}:8081"
    networks:
    - net-tgs
networks:
  net-tgs: 
volumes:
  mongo-db: 
  mongo-log: 
  mongo-config: 
