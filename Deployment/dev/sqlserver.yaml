apiVersion: apps/v1
kind: Deployment
metadata:
  name: mssql-deployment
  namespace: default
spec:
  selector:
    matchLabels:
      app: mssql
  replicas: 1
  template:
    metadata:
      labels:
        app: mssql
    spec:
      terminationGracePeriodSeconds: 10
      containers:
      - name: mssql2019
        image: mcr.microsoft.com/mssql/server:2019-GA-ubuntu-16.04
        securityContext:
          runAsUser: 0
          runAsGroup: 0
        ports:
        - containerPort: 1433
        env:
        - name: MSSQL_PID
          value: "Developer"
        - name: ACCEPT_EULA
          value: "Y"
        - name: MSSQL_SA_PASSWORD
          value: "1qaz2wsx!@"
        volumeMounts:
        - name: mssqldb
          mountPath: /var/opt/mssql
      volumes:
      - name: mssqldb
        persistentVolumeClaim:
          claimName: pvc-mssql-data
---
apiVersion: v1
kind: Service
metadata:
  name: mssql-service
  namespace: default
spec:
  selector:
    app: mssql
  ports:
    - protocol: TCP
      port: 1433
      nodePort: 32274
      targetPort: 1433
  type: NodePort
---
kind: StorageClass
apiVersion: storage.k8s.io/v1
metadata:
    name: local-storage
    annotations:
        storageclass.kubernetes.io/is-default-class: "true"
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
---
kind: PersistentVolume
apiVersion: v1
metadata:
  name: pv-mssql-data
  labels:
    type: local
spec:
  storageClassName: local-storage
  capacity:
    storage: 500Gi #15GB容量大小
  accessModes:
    - ReadWriteOnce #只允許單一PVC獨佔
  claimRef:
    namespace: default
    name: pvc-mssql-data
  hostPath:
    path: "/var/opt/mssql"
---
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: pvc-mssql-data
  namespace: default
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 500Gi #只分配5GB容量大小
  storageClassName: local-storage