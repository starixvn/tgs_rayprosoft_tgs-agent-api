apiVersion: apps/v1
kind: Deployment
metadata:
  name: dev-backoffice-api
  namespace: default
  labels:
    name:  dev-backoffice-api
spec:
  replicas: 2
  selector:
    matchLabels:
      name: dev-backoffice-api
  strategy:
    type: RollingUpdate #使用RollingUpdate類型, 可以保證佈署期間服務不中斷
    rollingUpdate:
      maxUnavailable: 1 #佈署期間允許最大停止pod數量(replicas)
      maxSurge: 2 #佈署期間允許最大建立pod數量(replicas)
  template:
    metadata:
      labels:
        name: dev-backoffice-api
    spec:
      containers:
      - name: dev-backoffice-api
        image: rayprosoft/turnkey-gaming-system/dev-backoffice-api
        ports:
          - containerPort: 443
        imagePullPolicy: Always
        resources:
          requests:
            cpu: 240m
        volumeMounts:
          - name: netcorecert
              mountPath: /root/.dotnet/https
      volumes:
        - name: netcorecert
            hostPath: 
            path: /home/tgs
            type: Directory  
---

apiVersion:v1
kind: Service
metadata: 
    name: dev-backoffice-api
    namespace: default
spec: 
    selector:
        app: dev-backoffice-api
        ports: 5001
        nodePort: 30008
        targetPort: 5001
    type: NodePort
            
