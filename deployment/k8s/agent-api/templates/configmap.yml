apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "agent-api.fullname" . }}
data:
  appsettings.json: |
    {
      "Agent": {
        "ValidateCodeBaseUrl": "http://validatecode-api",
        "PaymentServiceBaseUrl": "http://payment-api",
        "BrandCertificateBaseUrl": "http://brand-cert-api",
        "PlayerServiceBaseUrl": "http://player-api",
        "CashBaseUrl": "http://cashservice-api",
        "AgentServiceBaseUrl": "http://agent-service",
        "VipLevelServiceBaseUrl": "http://tgs-viplevel"
      },
      "Logging": {
        "LogLevel": {
          "Default": "Information",
          "Microsoft": "Warning",
          "Microsoft.Hosting.Lifetime": "Information"
        }
      },
      "AllowedHosts": "*",
      "NatsSetting": {
        "ConnectTimeoutMs": 2000,
        "PingInterval": 5000,
        "PingMaxOutStanding": 3,
        "SubscriptionBatchSize": 128
      },
      "CorsDomain": {
        "Urls": []
      },
      "Report": {
        "Url": "http://report-api"
      },
      "Promotion": {
        "Url": "http://promotion-api"
      },
      "Email": {
        "Url": "https://email.srvptt.com"
      },
      "RequestLocalization": {
        "DefaultRequestCulture": "en-US",
        "ApplyCurrentCultureToResponseHeaders": true,
        "SupportedCultures": [ "en-US", "zh-CN", "zh-TW", "th-TH" ],
        "SupportedUICultures": [ "en-US", "zh-CN", "zh-TW", "th-TH" ]
      },
      "ForwardedHeaders": {
        "ForwardLimit": 1,
        "ForwardedForHeaderName": "cf-connecting-ip",
        "KnownProxies": [],
        "KnownNetworks": ["10.0.0.0/8"]
      }
    }
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:

    processors:
      batch:

    exporters:
      otlp:
        endpoint: "$NODE_IP:4317"
        tls:
          insecure: true
      prometheus:
        endpoint: "0.0.0.0:8889"
        namespace: "tgs"

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    service:
      extensions: [health_check]
      pipelines:
        traces: 
          receivers: [otlp]
          processors:
            - batch
          exporters: [otlp]
        metrics:
          receivers: [otlp]
          exporters: [prometheus]