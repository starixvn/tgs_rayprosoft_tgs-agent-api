# Default values for agent-api.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: pgtgs/agent-api
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "dev"

imagePullSecrets:
  - name: dockerhub
nameOverride: "agent-api"
fullnameOverride: "agent-api"
namespace: dev

podAnnotations:
  prometheus.io/path: /metrics
  prometheus.io/port: "52325"
  prometheus.io/scrape: "true"

connectionStrings:
  tgs: Server=pgpool;Port=9999;Database=tgs;User Id=rpdev;Password=abcd1234
  redis: redis-master,abortConnect=false,connectTimeout=3000,password=1qaz2wsx

nats:
  urls: nats://nats-client:4222

mail:
  url: https://email.srvptt.com

podSecurityContext: {}
  # fsGroup: 2000

securityContext:
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000
  runAsUser: 0
  runAsGroup: 0

service:
  type: ClusterIP
  port: 80

resources: {}
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 60
  targetMemoryUtilizationPercentage: 60

nodeSelector: {}

tolerations: []

affinity: {}
